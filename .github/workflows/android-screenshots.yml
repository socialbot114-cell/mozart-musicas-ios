name: Músicas para Estudar Android Screenshots

on:
  workflow_dispatch:
  push:
    branches: ["**"]
    paths:
      - "app/**"
      - "ci_scripts/**"
      - "gradle/**"
      - "gradlew"
      - "build.gradle"
      - "settings.gradle"
      - ".github/workflows/android-screenshots.yml"
  pull_request:
    branches: [main]
    paths:
      - "app/**"
      - "ci_scripts/**"
      - "gradle/**"
      - "gradlew"
      - "build.gradle"
      - "settings.gradle"
      - ".github/workflows/android-screenshots.yml"

permissions:
  contents: read

jobs:
  screenshots:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
          cache: gradle

      - name: Build app
        run: ./gradlew assembleDebug --console=plain

      - name: Run app in Android emulator and capture screens
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 35
          arch: x86_64
          profile: pixel_2
          disable-animations: true
          script: |
            set -u
            sdkmanager "platforms;android-36" "build-tools;35.0.0" || exit $?
            mkdir -p "$RUNNER_TEMP/android-screenshots"
            python3 ci_scripts/capture_android_screenshots.py \
              --output "$RUNNER_TEMP/android-screenshots"

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: musicas-para-estudar-android-screenshots
          path: ${{ runner.temp }}/android-screenshots/
          if-no-files-found: warn
          retention-days: 14
