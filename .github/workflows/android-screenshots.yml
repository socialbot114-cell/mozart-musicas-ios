name: Músicas para Estudar Android Screenshots

on:
  workflow_dispatch:
  push:
    branches: ["**"]
    paths:
      - "app/**"
      - "ci_scripts/**"
      - "gradle/**"
      - "gradlew"
      - "build.gradle"
      - "settings.gradle"
      - ".github/workflows/android-screenshots.yml"
  pull_request:
    branches: [main]
    paths:
      - "app/**"
      - "ci_scripts/**"
      - "gradle/**"
      - "gradlew"
      - "build.gradle"
      - "settings.gradle"
      - ".github/workflows/android-screenshots.yml"

permissions:
  contents: read

jobs:
  screenshots:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
          cache: gradle

      - name: Build app
        run: ./gradlew assembleDebug --console=plain

      - name: Prepare smaller screenshot APK
        run: |
          python3 ci_scripts/prepare_android_screenshot_apk.py \
            --input app/build/outputs/apk/debug/app-debug.apk \
            --output "$RUNNER_TEMP/app-screenshot-unsigned.apk"
          keytool -genkeypair \
            -keystore "$RUNNER_TEMP/screenshot.keystore" \
            -storepass android \
            -alias androiddebugkey \
            -keypass android \
            -dname "CN=Android Debug,O=Android,C=US" \
            -validity 10000 \
            -keyalg RSA
          "$ANDROID_HOME/build-tools/35.0.0/apksigner" sign \
            --ks "$RUNNER_TEMP/screenshot.keystore" \
            --ks-pass pass:android \
            --key-pass pass:android \
            --ks-key-alias androiddebugkey \
            --out "$RUNNER_TEMP/app-screenshot.apk" \
            "$RUNNER_TEMP/app-screenshot-unsigned.apk"
          "$ANDROID_HOME/build-tools/35.0.0/apksigner" verify "$RUNNER_TEMP/app-screenshot.apk"

      - name: Run app in Android emulator and capture screens
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 30
          arch: x86_64
          profile: pixel_2
          emulator-options: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -camera-back none -memory 3072 -skin 720x1280 -dpi-device 320
          disable-animations: false
          script: |
            set -u
            sdkmanager "platforms;android-36" "build-tools;35.0.0" || exit $?
            mkdir -p "$RUNNER_TEMP/android-screenshots"
            python3 ci_scripts/capture_android_screenshots.py --output "$RUNNER_TEMP/android-screenshots" --apk "$RUNNER_TEMP/app-screenshot.apk"

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: musicas-para-estudar-android-screenshots
          path: ${{ runner.temp }}/android-screenshots/
          if-no-files-found: warn
          retention-days: 14
