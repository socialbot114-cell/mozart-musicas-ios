name: Músicas para Estudar iOS Screenshots

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  screenshots:
    runs-on: macos-26
    strategy:
      matrix:
        device:
          - name: iPhone 17
            slug: iphone
          - name: iPad Air 13-inch (M4)
            slug: ipad
    steps:
      - uses: actions/checkout@v4
      - name: Install XcodeGen
        run: brew install xcodegen
      - name: Use lightweight screenshot bundle
        working-directory: ios
        run: find MusicasParaEstudar/Resources/Audio -type f -name '*.mp3' -delete
      - name: Generate project
        working-directory: ios
        run: xcodegen generate
      - name: Capture screenshots
        working-directory: ios
        run: |
          set -uo pipefail
          result_bundle="$RUNNER_TEMP/musicas-para-estudar-${{ matrix.device.slug }}.xcresult"
          xcodebuild test \
            -project MusicasParaEstudar.xcodeproj \
            -scheme MusicasParaEstudar \
            -destination 'platform=iOS Simulator,name=${{ matrix.device.name }},OS=26.5' \
            -resultBundlePath "$result_bundle" \
            -only-testing:MusicasParaEstudarUITests \
            CODE_SIGNING_ALLOWED=NO || test_status=$?
          if [[ -d "$result_bundle" ]]; then
            xcrun xcresulttool export attachments \
              --path "$result_bundle" \
              --output-path "$RUNNER_TEMP/musicas-para-estudar-screenshots-${{ matrix.device.slug }}" || test_status=${test_status:-$?}
          fi
          exit "${test_status:-0}"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: musicas-para-estudar-ios-screenshots-${{ matrix.device.slug }}
          path: ${{ runner.temp }}/musicas-para-estudar-screenshots-${{ matrix.device.slug }}
