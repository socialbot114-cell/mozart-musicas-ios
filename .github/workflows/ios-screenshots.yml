name: Mozart iOS Screenshots

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  screenshots:
    runs-on: macos-26
    strategy:
      matrix:
        device:
          - name: iPhone 17
            slug: iphone
          - name: iPad Air 13-inch (M4)
            slug: ipad
    steps:
      - uses: actions/checkout@v4
      - name: Install XcodeGen
        run: brew install xcodegen
      - name: Use lightweight screenshot bundle
        working-directory: ios
        run: find MusicasParaEstudar/Resources/Audio -type f -name '*.mp3' -delete
      - name: Generate project
        working-directory: ios
        run: xcodegen generate
      - name: Capture screenshots
        working-directory: ios
        run: |
          set -euo pipefail
          xcodebuild test \
            -project MusicasParaEstudar.xcodeproj \
            -scheme MusicasParaEstudar \
            -destination 'platform=iOS Simulator,name=${{ matrix.device.name }},OS=26.5' \
            -resultBundlePath "$RUNNER_TEMP/mozart-${{ matrix.device.slug }}.xcresult" \
            -only-testing:MusicasParaEstudarUITests \
            CODE_SIGNING_ALLOWED=NO
          xcrun xcresulttool export attachments \
            --path "$RUNNER_TEMP/mozart-${{ matrix.device.slug }}.xcresult" \
            --output-path "$RUNNER_TEMP/mozart-screenshots-${{ matrix.device.slug }}"
      - uses: actions/upload-artifact@v4
        with:
          name: mozart-ios-screenshots-${{ matrix.device.slug }}
          path: ${{ runner.temp }}/mozart-screenshots-${{ matrix.device.slug }}
