name: MusicasParaEstudar
options:
  bundleIdPrefix: br.com.musicaspara
  deploymentTarget:
    iOS: "17.0"
settings:
  base:
    SWIFT_VERSION: 5.9
    PRODUCT_BUNDLE_IDENTIFIER: br.com.musicaspara.estudar
    DEVELOPMENT_TEAM: ""
targets:
  MusicasParaEstudar:
    type: application
    platform: iOS
    sources: [MusicasParaEstudar]
    resources: [Resources, Catalog, Privacy/PrivacyInfo.xcprivacy]
    info:
      path: Privacy/Info.plist
    settings:
      INFOPLIST_KEY_CFBundleDisplayName: Músicas para Estudar
      INFOPLIST_KEY_UIApplicationSceneManifest_Generation: YES
      INFOPLIST_KEY_UIBackgroundModes: [audio]
  MusicasParaEstudarTests:
    type: bundle.unit-test
    platform: iOS
    sources: [MusicasParaEstudarTests]
    dependencies:
      - target: MusicasParaEstudar
