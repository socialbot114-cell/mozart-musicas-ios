name: MusicasParaEstudar
options:
  bundleIdPrefix: br.com.musicaspara
  deploymentTarget:
    iOS: "17.0"
settings:
  base:
    SWIFT_VERSION: 5.9
    PRODUCT_BUNDLE_IDENTIFIER: br.com.musicaspara.estudar
    GENERATE_INFOPLIST_FILE: NO
    INFOPLIST_FILE: Privacy/Info.plist
    DEVELOPMENT_TEAM: ""
targets:
  MusicasParaEstudar:
    type: application
    platform: iOS
    sources:
      - path: MusicasParaEstudar
        excludes: [Resources]
      - path: MusicasParaEstudar/Resources/Assets.xcassets
        buildPhase: resources
      - path: MusicasParaEstudar/Resources/Audio
        type: folder
        buildPhase: resources
      - path: StoreKit/Donation.storekit
        buildPhase: resources
      - path: Catalog
        type: folder
        buildPhase: resources
      - path: Privacy/PrivacyInfo.xcprivacy
        buildPhase: resources
      - path: LaunchScreen.storyboard
        buildPhase: resources
    settings:
      PRODUCT_BUNDLE_IDENTIFIER: br.com.musicaspara.estudar
      INFOPLIST_KEY_CFBundleDisplayName: Músicas para Estudar
      GENERATE_INFOPLIST_FILE: NO
      INFOPLIST_FILE: Privacy/Info.plist
      PRIVACY_MANIFEST_FILE: MusicasParaEstudar/Resources/PrivacyInfo.xcprivacy
      ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
      TARGETED_DEVICE_FAMILY: "1,2"
      FRAMEWORK_SEARCH_PATHS: "$(inherited) $(PLATFORM_DIR)/Developer/Library/Frameworks $(SDKROOT)/Developer/Library/Frameworks"
    scheme:
      testTargets:
        - MusicasParaEstudarTests
        - MusicasParaEstudarUITests
      storeKitConfiguration: StoreKit/Donation.storekit
  MusicasParaEstudarTests:
    type: bundle.unit-test
    platform: iOS
    sources: [MusicasParaEstudarTests]
    dependencies:
      - target: MusicasParaEstudar
    settings:
      base:
        TEST_HOST: $(BUILT_PRODUCTS_DIR)/MusicasParaEstudar.app/MusicasParaEstudar
        BUNDLE_LOADER: $(TEST_HOST)
  MusicasParaEstudarUITests:
    type: bundle.ui-testing
    platform: iOS
    sources: [MusicasParaEstudarUITests]
    dependencies:
      - target: MusicasParaEstudar
    settings:
      PRODUCT_BUNDLE_IDENTIFIER: br.com.musicaspara.estudar.uitests
      TEST_TARGET_NAME: MusicasParaEstudar
