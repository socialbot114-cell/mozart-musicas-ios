name: MusicasParaEstudar
options:
  bundleIdPrefix: br.com.musicaspara
  deploymentTarget:
    iOS: "17.0"
settings:
  base:
    SWIFT_VERSION: 5.9
    PRODUCT_BUNDLE_IDENTIFIER: br.com.musicaspara.estudar
    GENERATE_INFOPLIST_FILE: NO
    INFOPLIST_FILE: Privacy/Info.plist
    DEVELOPMENT_TEAM: ""
targets:
  MusicasParaEstudar:
    type: application
    platform: iOS
    sources:
      - path: MusicasParaEstudar
        excludes: [Resources]
    resources:
      - path: MusicasParaEstudar/Resources/Assets.xcassets
      - path: MusicasParaEstudar/Resources/Audio
        type: folder
      - path: Catalog
        type: folder
      - path: Privacy/PrivacyInfo.xcprivacy
      - path: LaunchScreen.storyboard
    settings:
      INFOPLIST_KEY_CFBundleDisplayName: Músicas para Estudar
      GENERATE_INFOPLIST_FILE: NO
      INFOPLIST_FILE: Privacy/Info.plist
      PRIVACY_MANIFEST_FILE: Resources/PrivacyInfo.xcprivacy
      ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
      TARGETED_DEVICE_FAMILY: "1,2"
  MusicasParaEstudarTests:
    type: bundle.unit-test
    platform: iOS
    sources: [MusicasParaEstudarTests]
    dependencies:
      - target: MusicasParaEstudar
